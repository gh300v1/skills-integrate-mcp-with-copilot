<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="account-container">
        <h3>Student Account</h3>
        <div id="account-status" class="hidden"></div>
        <div id="auth-forms">
          <form id="register-form">
            <h4>Create an account</h4>
            <div class="form-group">
              <label for="full-name">Full name:</label>
              <input type="text" id="full-name" required />
            </div>
            <div class="form-group">
              <label for="grade-level">Grade level:</label>
              <input type="text" id="grade-level" required placeholder="Grade 10" />
            </div>
            <div class="form-group">
              <label for="register-email">School email:</label>
              <input type="email" id="register-email" required placeholder="your-email@mergington.edu" />
            </div>
            <div class="form-group">
              <label for="register-password">Password:</label>
              <input type="password" id="register-password" minlength="8" required />
            </div>
            <button type="submit">Create account</button>
          </form>

          <form id="login-form">
            <h4>Log in</h4>
            <div class="form-group">
              <label for="login-email">Email:</label>
              <input type="email" id="login-email" required />
            </div>
            <div class="form-group">
              <label for="login-password">Password:</label>
              <input type="password" id="login-password" required />
            </div>
            <button type="submit">Log in</button>
          </form>
        </div>
        <form id="verify-form" class="hidden">
          <label for="verification-token">Demo verification token:</label>
          <input type="text" id="verification-token" required />
          <button type="submit">Verify email</button>
        </form>
        <button id="logout-button" class="secondary hidden" type="button">Log out</button>
        <div id="auth-message" class="hidden"></div>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <p id="signup-account-note">Log in to sign up for an activity.</p>
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
